apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudpilot-sa
  namespace: cloudpilot

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudpilot-reader

rules:
- apiGroups: [""]
  resources:
    - pods
    - nodes
    - namespaces
  verbs:
    - get
    - list
    - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudpilot-reader-binding

subjects:
- kind: ServiceAccount
  name: cloudpilot-sa
  namespace: cloudpilot

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudpilot-reader